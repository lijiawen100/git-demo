  <h1>hello git!!</h1>
  <p>1.git init 初始化一个空仓库</p>
  <p>2.git add 文件名称 将文件加到暂存区</p>
  <p>3.git commit -m "提交的说明文字" 将暂存文件提交到本地仓库</p>
  <p>4.git status 查看仓库状态</p>
  <p>5.git diff  查看当前文件与最近一次提交的文件差异</p>
  <p>6.我写错了，添加到暂存区了</p>
